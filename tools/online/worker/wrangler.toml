name = "poc-online-relay"
main = "worker.js"
compatibility_date = "2026-11-01"

# Durable Objects con backend SQLite: disponibles en el plan Workers Free.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LISTS"
class_name = "RoomList"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoomList"]
