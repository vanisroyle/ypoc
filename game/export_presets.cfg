[preset.0]
name="Windows Launcher"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="bundled/*,build_info.json,translations/*.json"
exclude_filter="tests/*,scenarios/*,temp/*,artifacts/*,data/*"
export_path=""

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
debug/export_console_wrapper=0
application/icon="res://assets/icons/launcher.ico"
application/file_description="Launcher y motor; requiere recursos aportados por el usuario"
codesign/enable=false

[preset.1]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="web_icons/*,translations/*.json"
exclude_filter="tests/*,scenarios/*,temp/*,artifacts/*,data/*,bundled/*,webdata/*"
export_path="/tmp/webtest/index.html"
[preset.1.options]
variant/thread_support=true
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
html/icon="res://web_icons/icon-512.png"
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\"><meta name=\"apple-mobile-web-app-title\" content=\"Power of Chaos\"><meta name=\"theme-color\" content=\"#101018\">"
progressive_web_app/enabled=true
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/background_color="#101018"
progressive_web_app/icon_144x144="res://web_icons/icon-144.png"
progressive_web_app/icon_180x180="res://web_icons/icon-180.png"
progressive_web_app/icon_512x512="res://web_icons/icon-512.png"
application/product_name="Power of Chaos Remake"
